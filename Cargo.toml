[package]
name = "petri-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Generic places, transitions, tokens and markings for state-machine Petri nets"
repository = "https://github.com/Lsh0x/petri-net"
readme = "README.md"
keywords = ["petri-net", "workflow", "state-machine"]
categories = ["data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
