[package]
name = "petri-core"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Petri net models and an authenticated, transactional workflow engine"
repository = "https://github.com/Lsh0x/petri-net"
readme = "README.md"
keywords = ["petri-net", "workflow", "state-machine"]
categories = ["data-structures"]

[features]
default = []
tiercache = ["dep:tiercache"]

[dependencies]
hmac = "0.12"
sha2 = "0.10"
serde_json = "1"
tiercache = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
proptest = "1"
futures = { version = "0.3", features = ["executor"] }
