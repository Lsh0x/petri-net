[advisories]
version = 2
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

# Constant-time primitives used by RustCrypto's HMAC implementation.
[[licenses.exceptions]]
name = "subtle"
allow = ["BSD-3-Clause"]

# YAML's text-decoding dependency includes BSD-licensed encoding tables.
[[licenses.exceptions]]
name = "encoding_rs"
allow = ["BSD-3-Clause"]
